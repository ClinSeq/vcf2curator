name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # .python-version is not committed, so pin the interpreter here.
      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11

      - name: Run tests with coverage
        run: uv run pytest --cov=vcf2curator --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
